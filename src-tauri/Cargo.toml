[package]
name = "winclock"
version = "0.6.0"
description = "Digital clock widget for Windows"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
reqwest = "0.12"
winreg = "0.55"
tauri-plugin-window-state = "2.4.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
